<!doctype html>
<!--
  Tone curve editor (app/ui/curve_editor.py), like GIMP's Curves: the photo's histogram behind,
  the curve over it. Click to add a point, drag to move it, right click or double click to
  remove it; the end points are the black and white points and cannot be removed. The curve
  is drawn here with the same monotone cubic as tones.py, and the points are sent when a drag
  ends, so Python sees one change per gesture, with a ``change`` id to ignore repeats.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  svg { display: block; width: 100%; height: auto; touch-action: none; cursor: crosshair; border-radius: 6px; }
</style>
</head>
<body>
<svg id="curve" viewBox="-6 -6 268 268" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.getElementById("curve");
  const REACH = 9; // curve units: a press this close to a point grabs it
  let points = [[0, 0], [255, 255]];
  let histogram = [];
  let dark = false;
  let dragging = -1;

  function send(type, data) {
    window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, data), "*");
  }
  function fitHeight() {
    send("streamlit:setFrameHeight", { height: Math.ceil(svg.getBoundingClientRect().height) + 2 });
  }
  function commit() {
    send("streamlit:setComponentValue", { value: { points: points, change: Date.now() }, dataType: "json" });
  }

  // Monotone cubic (Fritsch–Carlson), as in tones.lut: flat outside the end points.
  function curveValues() {
    const x = points.map((p) => p[0]), y = points.map((p) => p[1]), n = x.length;
    const out = [];
    const h = [], d = [], m = new Array(n).fill(0);
    for (let i = 0; i < n - 1; i++) { h.push(x[i + 1] - x[i]); d.push((y[i + 1] - y[i]) / h[i]); }
    m[0] = d[0]; m[n - 1] = d[n - 2];
    for (let i = 1; i < n - 1; i++) {
      if (d[i - 1] * d[i] > 0) {
        const w1 = 2 * h[i] + h[i - 1], w2 = h[i] + 2 * h[i - 1];
        m[i] = (w1 + w2) / (w1 / d[i - 1] + w2 / d[i]);
      }
    }
    for (let v = 0; v <= 255; v++) {
      if (v <= x[0]) { out.push(y[0]); continue; }
      if (v >= x[n - 1]) { out.push(y[n - 1]); continue; }
      let i = 0;
      while (v > x[i + 1]) i++;
      if (n === 2) { out.push(y[0] + (y[1] - y[0]) * (v - x[0]) / (x[1] - x[0])); continue; }
      const t = (v - x[i]) / h[i], t2 = t * t, t3 = t2 * t;
      out.push((2 * t3 - 3 * t2 + 1) * y[i] + (t3 - 2 * t2 + t) * h[i] * m[i]
        + (-2 * t3 + 3 * t2) * y[i + 1] + (t3 - t2) * h[i] * m[i + 1]);
    }
    return out.map((v) => Math.max(0, Math.min(255, v)));
  }

  function el(name, attrs) {
    const node = document.createElementNS(NS, name);
    for (const key in attrs) node.setAttribute(key, attrs[key]);
    svg.appendChild(node);
    return node;
  }

  function draw() {
    svg.innerHTML = "";
    const ink = dark ? "#e8eaed" : "#1f2933";
    const faint = dark ? "#3b4048" : "#dde1e6";
    el("rect", { x: 0, y: 0, width: 255, height: 255, fill: dark ? "#1b1e24" : "#ffffff", stroke: faint });
    const bar = 255 / Math.max(histogram.length, 1);
    histogram.forEach((value, i) => {
      el("rect", { x: i * bar, y: 255 - value * 255, width: bar + 0.2, height: value * 255, fill: dark ? "#2f3540" : "#e6e9ee" });
    });
    for (const g of [64, 128, 192]) {
      el("line", { x1: g, y1: 0, x2: g, y2: 255, stroke: faint, "stroke-width": 0.6 });
      el("line", { x1: 0, y1: g, x2: 255, y2: g, stroke: faint, "stroke-width": 0.6 });
    }
    el("line", { x1: 0, y1: 255, x2: 255, y2: 0, stroke: faint, "stroke-width": 1, "stroke-dasharray": "4 3" });
    const values = curveValues();
    el("path", { d: values.map((v, i) => (i ? "L" : "M") + i + " " + (255 - v)).join(" "), fill: "none", stroke: ink, "stroke-width": 2 });
    points.forEach((p, i) => {
      const end = i === 0 || i === points.length - 1;
      el("circle", { cx: p[0], cy: 255 - p[1], r: 5.5, fill: end ? ink : "#e85d04", stroke: dark ? "#1b1e24" : "#ffffff", "stroke-width": 2 });
    });
  }

  function toCurve(event) {
    const box = svg.getBoundingClientRect();
    const scale = 268 / box.width;
    const x = (event.clientX - box.left) * scale - 6, y = (event.clientY - box.top) * scale - 6;
    return [Math.round(Math.max(0, Math.min(255, x))), Math.round(Math.max(0, Math.min(255, 255 - y)))];
  }
  function nearest(at) {
    let best = -1, distance = REACH;
    points.forEach((p, i) => {
      const d = Math.hypot(p[0] - at[0], p[1] - at[1]);
      if (d <= distance) { best = i; distance = d; }
    });
    return best;
  }
  function removeAt(event) {
    event.preventDefault();
    const i = nearest(toCurve(event));
    if (i > 0 && i < points.length - 1) { points.splice(i, 1); draw(); commit(); }
  }

  svg.addEventListener("pointerdown", (event) => {
    if (event.button !== 0) return;
    const at = toCurve(event);
    let i = nearest(at);
    if (i < 0) {
      if (points.some((p) => p[0] === at[0])) return;
      points.push(at);
      points.sort((a, b) => a[0] - b[0]);
      i = points.findIndex((p) => p[0] === at[0] && p[1] === at[1]);
    }
    dragging = i;
    svg.setPointerCapture(event.pointerId);
    draw();
  });
  svg.addEventListener("pointermove", (event) => {
    if (dragging < 0) return;
    const at = toCurve(event);
    const low = dragging === 0 ? 0 : points[dragging - 1][0] + 1;
    const high = dragging === points.length - 1 ? 255 : points[dragging + 1][0] - 1;
    points[dragging] = [Math.max(low, Math.min(high, at[0])), at[1]];
    draw();
  });
  svg.addEventListener("pointerup", () => {
    if (dragging < 0) return;
    dragging = -1;
    commit();
  });
  svg.addEventListener("contextmenu", removeAt);
  svg.addEventListener("dblclick", removeAt);
  window.addEventListener("resize", fitHeight);

  window.addEventListener("message", (event) => {
    if (!event.data || event.data.type !== "streamlit:render") return;
    const args = event.data.args;
    if (dragging < 0) points = args.points.map((p) => [p[0], p[1]]);
    histogram = args.histogram || [];
    dark = !!(event.data.theme && event.data.theme.base === "dark");
    draw();
    fitHeight();
  });

  send("streamlit:componentReady", { apiVersion: 1 });
</script>
</body>
</html>
