services:
  app:
    build: .
    container_name: colorin-colorado
    # Run as the host user so books/ and data/ stay owned by you, not root.
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      # Only this computer can open the app. To use it from other devices on your network, start
      # it with COLORIN_BIND=0.0.0.0 (anyone on that network can then use it and your Gemini key).
      - "${COLORIN_BIND:-127.0.0.1}:8502:8502"
    volumes:
      # Live-reload the code while developing
      - ./app:/workspace/app
      - ./tests:/workspace/tests
      - ./scripts:/workspace/scripts
      # Books (photos, coloring pages, exports) and the usage log persist on the host
      - ./books:/workspace/books
      - ./data:/workspace/data
      # Downloaded models (background removal), kept between rebuilds
      - ./models:/workspace/models
      # Settings (config/.env)
      - ./config:/workspace/config
      # Google Cloud credentials (GEMINI_AUTH=adc) are mounted by docker-compose.override.yml,
      # created from docker-compose.override.example.yml; API keys need nothing here.
    environment:
      - HOME=/tmp
      - STREAMLIT_SERVER_FILE_WATCHER_TYPE=poll
      - STREAMLIT_CLIENT_TOOLBAR_MODE=minimal
    restart: unless-stopped

  # Local GPU engine (optional): Qwen-Image-2.1 on an NVIDIA GPU. Started by `./launch.sh` when a
  # capable GPU is present, or with: docker compose --profile gpu up -d
  # The first start downloads ~33 GB of weights into the local-image-models volume. Settings
  # (LOCAL_IMAGE_*) come from config/.env; see docs/setup.md.
  local-image:
    build: ./local_image
    container_name: colorin-colorado-local-image
    profiles: ["gpu"]
    ports:
      # Loopback only: the server has no authentication. The app reaches it through the
      # compose network at http://local-image:8000.
      - "127.0.0.1:8602:8000"
    volumes:
      - local-image-models:/models
      # The server reads only the LOCAL_IMAGE_* keys of config/.env, never the API key.
      - ./config:/config:ro
    environment:
      - LOCAL_IMAGE_CONFIG=/config/.env
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  local-image-models:
